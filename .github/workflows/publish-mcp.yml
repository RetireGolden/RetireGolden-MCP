# Publishes @retiregolden/mcp to npm.
#
# Trigger by pushing a tag `mcp-v<version>` (must match package.json version),
# or manually via workflow_dispatch (defaults to dry-run).
#
# Publishes via npm Trusted Publishing (OIDC): the @retiregolden/mcp package on
# npmjs.com is configured with a trusted publisher pinned to this repo, this
# workflow filename, and the `npm-publish` environment, so no long-lived token
# is needed. It requires a minimum npm version (NPM_MIN in the "Pin the npm
# that publishes" step below); that step installs one exact npm version
# (NPM_PIN) on every run, regardless of what the runner's Node bundles, and
# fails the job if the pin is below the minimum.
# There is no NPM_TOKEN: token-based publishing has been retired, and the npm
# package is set to disallow tokens, so releases authenticate only via OIDC.
#
# The publish job runs in the `npm-publish` environment, which requires manual
# approval from FlyOverCoderKY before any release. Its deployment branch policy
# allows the tag pattern `mcp-v*` plus the `main` branch; `main` is permitted
# only so dry-runs can be dispatched, and the `guard` job below is what keeps a
# dispatch from ever becoming a real publish. Self-review is deliberately
# allowed (single-maintainer org — otherwise every release deadlocks).

name: Publish mcp package

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Use npm publish --dry-run (no release)
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

jobs:
  # Real publishes must originate from an `mcp-v*` tag push, because the tag is
  # what triggers the version-consistency check below. A manual dispatch skips
  # that check, so dispatch is dry-run only. This guard deliberately lives in
  # its own ungated job: the `npm-publish` environment pauses `publish` for
  # approval before any of its steps run, so a guard inside that job would only
  # fire after a reviewer had already approved the deployment.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-dry-run manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false'
        run: |
          echo "Manual dispatch is dry-run only. To publish for real, push a tag mcp-v<version> matching package.json." >&2
          exit 1

  publish:
    runs-on: ubuntu-latest
    needs: guard
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install pnpm before setup-node so `cache: pnpm` can locate the store.
      # Corepack on the runner's preinstalled Node does not shim the Node that
      # setup-node later downloads.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # actions/setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into the generated npmrc. With no NODE_AUTH_TOKEN set (the OIDC state),
      # npm reads that as a configured credential and skips the OIDC trusted-
      # publishing exchange, so the publish fails to authenticate. Strip the line
      # so npm sees no credentials and uses OIDC. See actions/setup-node#1551.
      - name: Remove npm auth placeholder so OIDC is used
        run: |
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi

      # Every action in this workflow is pinned to a SHA, and the npm that
      # performs the publish is pinned the same way: NPM_PIN is installed on
      # every run, so the publish CLI never depends on what the floating
      # `node-version: "24"` image happens to bundle, and two releases from the
      # same commit run the same npm. (`npm@latest` would have put whatever npm
      # shipped that day into the release path with no review; using the bundled
      # npm conditionally would have left it moving with the runner image.)
      # Because the install runs unconditionally, every dry-run dispatch
      # exercises it too, so a broken pin fails there rather than during an
      # approval-gated release. The version check after the install fails the
      # job if NPM_PIN is ever bumped below NPM_MIN, the OIDC trusted-publishing
      # minimum; without it a too-old pin would surface later as an opaque
      # authentication error from `npm publish --provenance`. Bump NPM_PIN
      # deliberately (Dependabot does not track this line) and keep it on the
      # same major the bundled npm uses.
      - name: Pin the npm that publishes
        env:
          NPM_MIN: "11.5.1"
          NPM_PIN: "11.18.0"
        run: |
          npm install -g "npm@$NPM_PIN"
          have="$(npm --version)"
          if [ "$have" != "$NPM_PIN" ]; then
            echo "npm --version reports $have after installing npm@$NPM_PIN" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$NPM_MIN" "$have" | sort -V | head -n1)" != "$NPM_MIN" ]; then
            echo "npm@$NPM_PIN is below the OIDC trusted-publishing minimum $NPM_MIN" >&2
            exit 1
          fi
          echo "publishing with npm $have (pinned; OIDC minimum $NPM_MIN)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          tag="${GITHUB_REF_NAME#mcp-v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag mcp-v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # The release gate proper: pack the artifact this job is about to
      # publish, npm-install it into a scratch consumer, and prove both
      # protocol eras plus the committed wire baseline against it. Publishing
      # must never be possible from a commit that did not pass this.
      - name: Packed-artifact gate
        run: pnpm run test:packed

      - name: Publish to npm
        # No NODE_AUTH_TOKEN: auth is via OIDC trusted publishing. `id-token:
        # write` (set at the top) lets npm exchange a short-lived OIDC token for
        # publish credentials, and provenance is generated automatically.
        env:
          EVENT_NAME: ${{ github.event_name }}
        # Belt-and-braces: any workflow_dispatch publishes with --dry-run, no
        # matter what the dry_run input says. The `guard` job already rejects a
        # dispatch with dry_run=false, but even if that guard is removed this
        # step still cannot make a real release from a dispatch. Real publishes
        # come only from an `mcp-v*` tag push (event_name = push), which is what
        # runs the tag/package.json version check above.
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public --provenance
          fi
