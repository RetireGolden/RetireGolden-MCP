# Publishes @retiregolden/mcp to npm.
#
# Trigger by pushing a tag `mcp-v<version>` (must match package.json version),
# or manually via workflow_dispatch (defaults to dry-run).
#
# Publishes via npm Trusted Publishing (OIDC): the @retiregolden/mcp package on
# npmjs.com is configured with a trusted publisher pinned to this repo, this
# workflow filename, and the `npm-publish` environment, so no long-lived token
# is needed. It requires a minimum npm version (NPM_MIN in the "Pin the npm
# that publishes" step below); that step installs one exact npm version
# (NPM_PIN) on every run, regardless of what the runner's Node bundles, and
# fails the job if the pin is below the minimum.
# There is no NPM_TOKEN: token-based publishing has been retired, and the npm
# package is set to disallow tokens, so releases authenticate only via OIDC.
#
# The publish job runs in the `npm-publish` environment, which requires manual
# approval from FlyOverCoderKY before any release. Its deployment branch policy
# allows the tag pattern `mcp-v*` plus the `main` branch; `main` is permitted
# only so dry-runs can be dispatched, and the `guard` job below is what keeps a
# dispatch from ever becoming a real publish. Self-review is deliberately
# allowed (single-maintainer org — otherwise every release deadlocks).

name: Publish mcp package

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Use npm publish --dry-run (no release)
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  # Real publishes must originate from an `mcp-v*` tag push, because the tag is
  # what triggers the version-consistency check below. A manual dispatch skips
  # that check, so dispatch is dry-run only. This guard deliberately lives in
  # its own ungated job: the `npm-publish` environment pauses `publish` for
  # approval before any of its steps run, so a guard inside that job would only
  # fire after a reviewer had already approved the deployment.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject non-dry-run manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false'
        run: |
          echo "Manual dispatch is dry-run only. To publish for real, push a tag mcp-v<version> matching package.json." >&2
          exit 1

  build-and-pack:
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      contents: read
    outputs:
      tarball_sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          tag="${GITHUB_REF_NAME#mcp-v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag mcp-v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Pack release tarball
        id: pack
        run: |
          artifact_dir="$RUNNER_TEMP/mcp-package"
          mkdir -p "$artifact_dir"
          pnpm pack --pack-destination "$artifact_dir"

          mapfile -t tarballs < <(find "$artifact_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one release tarball; found ${#tarballs[@]}." >&2
            exit 1
          fi

          tarball="${tarballs[0]}"
          tarball_name="$(basename "$tarball")"
          digest="$(sha256sum "$tarball" | awk '{print $1}')"
          (cd "$artifact_dir" && sha256sum "$tarball_name" > package.sha256)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Packed-artifact gate
        env:
          PACKED_TARBALL_PATH: ${{ steps.pack.outputs.tarball }}
        run: pnpm run test:packed

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-package
          path: ${{ runner.temp }}/mcp-package
          if-no-files-found: error
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: [guard, build-and-pack]
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-package
          path: ${{ runner.temp }}/mcp-package

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Remove npm auth placeholder so OIDC is used
        run: |
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Pin the npm that publishes
        env:
          NPM_MIN: "11.5.1"
          NPM_PIN: "11.18.0"
        run: |
          npm install -g --ignore-scripts "npm@$NPM_PIN"
          have="$(npm --version)"
          if [ "$have" != "$NPM_PIN" ]; then
            echo "npm --version reports $have after installing npm@$NPM_PIN" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$NPM_MIN" "$have" | sort -V | head -n1)" != "$NPM_MIN" ]; then
            echo "npm@$NPM_PIN is below the OIDC trusted-publishing minimum $NPM_MIN" >&2
            exit 1
          fi

      - name: Verify package artifact
        id: verify
        env:
          EXPECTED_SHA256: ${{ needs['build-and-pack'].outputs.tarball_sha256 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          artifact_dir="$RUNNER_TEMP/mcp-package"
          mapfile -t files < <(find "$artifact_dir" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#files[@]}" -ne 2 ] || [ ! -f "$artifact_dir/package.sha256" ]; then
            echo "Downloaded artifact must contain exactly one tarball and package.sha256." >&2
            exit 1
          fi

          mapfile -t tarballs < <(find "$artifact_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one downloaded tarball; found ${#tarballs[@]}." >&2
            exit 1
          fi

          tarball="${tarballs[0]}"
          (cd "$artifact_dir" && sha256sum --check package.sha256)
          actual_sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "Downloaded tarball digest does not match the build job output." >&2
            exit 1
          fi

          manifest_dir="$RUNNER_TEMP/mcp-manifest"
          mkdir -p "$manifest_dir"
          tar -xzf "$tarball" -C "$manifest_dir" package/package.json
          package_name="$(node -p "require('$manifest_dir/package/package.json').name")"
          package_version="$(node -p "require('$manifest_dir/package/package.json').version")"
          if [ "$package_name" != "@retiregolden/mcp" ]; then
            echo "Tarball package name is $package_name, expected @retiregolden/mcp." >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            case "$GITHUB_REF" in
              refs/tags/mcp-v*) ;;
              *) echo "Push publish must originate from an mcp-v<version> tag." >&2; exit 1 ;;
            esac
            tag_version="${GITHUB_REF#refs/tags/mcp-v}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "Tag mcp-v$tag_version does not match tarball version $package_version." >&2
              exit 1
            fi
          elif [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Unsupported publish event: $EVENT_NAME" >&2
            exit 1
          fi

          echo "Verified @retiregolden/mcp@$package_version ($actual_sha256)."
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          TARBALL: ${{ steps.verify.outputs.tarball }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            npm publish "$TARBALL" --ignore-scripts --access public --dry-run
          else
            npm publish "$TARBALL" --ignore-scripts --access public --provenance
          fi
