name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  matrix-test:
    name: test (${{ matrix.os }}, ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install pnpm before setup-node so `cache: pnpm` can locate the store.
      # Corepack on the runner's preinstalled Node does not shim the Node that
      # setup-node later downloads.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      # Release gate: the packed npm artifact (what `npx` installs) must serve
      # both protocol eras and match the committed wire baseline. Excluded from
      # the default vitest discovery because it packs and npm-installs.
      - run: pnpm run test:packed

  # Single stable check name for branch protection ("test"), independent of the
  # matrix shape. Fails unless every matrix leg succeeded.
  test:
    runs-on: ubuntu-latest
    needs: matrix-test
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.matrix-test.result }}" != "success" ]; then
            echo "Matrix result: ${{ needs.matrix-test.result }}" >&2
            exit 1
          fi
