name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  matrix-test:
    name: test (${{ matrix.os }}, ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build

  # Single stable check name for branch protection ("test"), independent of the
  # matrix shape. Fails unless every matrix leg succeeded.
  test:
    runs-on: ubuntu-latest
    needs: matrix-test
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.matrix-test.result }}" != "success" ]; then
            echo "Matrix result: ${{ needs.matrix-test.result }}" >&2
            exit 1
          fi
