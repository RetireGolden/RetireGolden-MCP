# Thin caller for the org-required OpenRouter PR review.
# Implementation lives in RetireGolden/.github — do not copy it here.
#
# Pass only OPENROUTER_API_KEY. Do not inherit.
#
# OpenRouter is the only automatic AI review workflow. The separate legacy
# Grok workflow is manual-only and is never a fallback for this caller.
# Per-PR concurrency belongs to the central reusable; do not add a
# workflow-level group here because it could cancel an active first pass.
# The stable required-check context is:
#
#   review / openrouter-first-pass-gate
#
# The lane roster is frozen by the exact central pin below. This repo runs
# x-ai/grok-4.6 + z-ai/glm-5.3-flash at high effort; the recall-safe judge
# merges the two independent OpenRouter lanes.

name: OpenRouter code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  # The central reusable publishes the stable required-gate commit status.
  statuses: write

jobs:
  # Keep this id stable: it is the first half of the required check context.
  review:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    uses: RetireGolden/.github/.github/workflows/openrouter-code-review.yml@f6aa157430509b5f6945b4fc2c9fafeeac4a7294 # .github#35 (action v1.2.7/#20; oversized-diff fallback, requested roster retained)
    with:
      pr_number: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
