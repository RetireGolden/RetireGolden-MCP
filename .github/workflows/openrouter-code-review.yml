# Thin caller for the org-required OpenRouter PR review.
# Implementation lives in RetireGolden/.github — do not copy it here.
#
# Pass only OPENROUTER_API_KEY. Do not inherit.
#
# OpenRouter is the only automatic AI review workflow. The separate legacy
# Grok workflow is manual-only and is never a fallback for this caller.
# Per-PR concurrency belongs to the central reusable; do not add a
# workflow-level group here because it could cancel an active first pass.
# The stable required-check context is:
#
#   review / openrouter-first-pass-gate
#
# The central pin defines permitted profiles: standard uses required Grok 4.6
# plus optional GLM 5.3 Flash; deep adds required Astra Flex. GPT 5.6 Luna
# is the merge judge. Initial and verification effort follow the selected profile.

name: OpenRouter code review
run-name: "${{ format('OpenRouter PR #{0}: {1}', github.event.pull_request.number || inputs.pr_number, inputs.review_level || 'auto') }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      review_level:
        description: Follow policy, request deep review, or cancel a pending deep request
        required: false
        type: choice
        options: [auto, deep, cancel]
        default: auto
      pr_number:
        description: PR number to review
        required: true
        type: string
      reset_review:
        description: Legacy input; profile reviews require false to retain findings
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: write
  # The central reusable publishes the stable required-gate commit status.
  statuses: write

jobs:
  # Keep this id stable: it is the first half of the required check context.
  review:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    uses: RetireGolden/.github/.github/workflows/openrouter-code-review.yml@3d92f63176b55e5ade2dbe4a081c21ad249826ea # .github#44; action#39@188cd5557765c858a37c1da78960cd353bcbcd60 (trusted profiles and request gates)
    with:
      review_policy: base
      review_profiles_enabled: true
      review_level: ${{ inputs.review_level || 'auto' }}
      reset_review: ${{ inputs.reset_review || false }}
      pr_number: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
