# Thin caller for the org-required Grok Build PR review.
# Implementation lives in RetireGolden/.github — do not copy it here.
#
# Pin fe20f331 (v1.0.5 keep-findings) because @main plus secrets: inherit
# left grok-first-pass-gate Expected. Pass only XAI_API_KEY; do not inherit
# (this repo holds CLA_PAT).
name: Grok code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: write

jobs:
  review:
    # Required Grok job must run on drafts (no draft skip) so grok-first-pass-gate posts before ready_for_review.
    uses: RetireGolden/.github/.github/workflows/grok-code-review.yml@ed323b2437d45eaec4ca6955c384bcf19aeb8357 # grok action v1.0.6 (dense-PR truncation degrades to partial)
    with:
      pr_number: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
    secrets:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
